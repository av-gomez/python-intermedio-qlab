# Streamlit Community Cloud ejecuta la app desde la raíz del repositorio y lee el tema de aquí.
# Es una copia de tarea_1/.streamlit/config.toml (usada al ejecutar en local desde tarea_1/).
[theme]
base = "light"
primaryColor = "#3f4a5c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6f9"
textColor = "#1f2328"
font = "sans serif"
